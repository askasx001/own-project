
{% extends "base.html" %}

{% block title %}Add Employee{% endblock %}

{% block content %}

<a href="{{ url_for('manager_employees') }}" class="back-btn">← Back to Employees</a>

<h1>Add Employee to {{ location }}</h1>

<div class="card">

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label for="employee_id">Employee ID *</label>

                <input type="text" id="employee_id" name="employee_id" placeholder="e.g. EMP-DEL-10" required>

            </div>

            <div class="form-group">

                <label for="name">Name *</label>

                <input type="text" id="name" name="name" required>

            </div>

            <div class="form-group">

                <label for="department">Department</label>

                <input type="text" id="department" name="department" placeholder="e.g. Customer Support">

            </div>

            <div class="form-group">

                <label for="email">Email</label>

                <input type="email" id="email" name="email" placeholder="e.g. employee@example.com">

            </div>

            <div class="form-group">

                <label for="password">Password *</label>

                <input type="password" id="password" name="password" required>

            </div>

        </div>

        <button type="submit" class="btn">Add Employee</button>

    </form>

</div>

{% endblock %}
